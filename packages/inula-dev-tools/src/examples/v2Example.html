<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inula 2.0 DevTools 示例</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }
    h1 {
      color: #333;
    }
    .component {
      border: 1px solid #ddd;
      padding: 20px;
      margin: 10px 0;
      border-radius: 8px;
      background: #f9f9f9;
    }
    button {
      padding: 10px 20px;
      margin: 5px;
      border: none;
      background: #4CAF50;
      color: white;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #45a049;
    }
  </style>
</head>
<body>
  <h1>Inula 2.0 DevTools 示例</h1>
  <div class="component">
    <h2>使用说明</h2>
    <ol>
      <li>确保已安装 Inula DevTools 浏览器扩展</li>
      <li>打开浏览器开发者工具</li>
      <li>切换到 "Inula" 标签页</li>
      <li>您应该能看到组件树和组件详情</li>
    </ol>
  </div>

  <div id="root"></div>

  <script type="module">
    // 模拟 Inula 2.0 环境
    
    // 标记为 Inula 2.0
    window.__INULA_V2__ = true;
    window.__INULA_NEXT__ = true;

    // 模拟 CompNode 类
    class CompNode {
      constructor(name, props = {}) {
        this.inulaType = 0; // Component
        this.name = name;
        this.props = props;
        this.nodes = [];
        this.subComponents = [];
        this.scope = {
          reactiveMap: {},
        };
        this.computations = [];
      }

      wave(value, dirty) {
        console.log(`Component ${this.name} updated with dirty bits:`, dirty);
      }
    }

    // 创建示例组件
    function createSampleApp() {
      const app = new CompNode('App', { title: 'Hello Inula 2.0' });
      
      const header = new CompNode('Header', { text: 'Welcome' });
      app.subComponents.push(header);

      const content = new CompNode('Content', { message: 'This is a test' });
      app.subComponents.push(content);

      const footer = new CompNode('Footer', { year: 2025 });
      app.subComponents.push(footer);

      return app;
    }

    // 模拟 render 函数
    window.render = function(compNode, container) {
      console.log('[Mock Render] Rendering component:', compNode.name);
      
      // 创建简单的 DOM
      const div = document.createElement('div');
      div.className = 'component';
      div.innerHTML = `
        <h3>${compNode.name}</h3>
        <pre>${JSON.stringify(compNode.props, null, 2)}</pre>
      `;
      
      container.appendChild(div);

      // 递归渲染子组件
      if (compNode.subComponents) {
        compNode.subComponents.forEach(child => {
          window.render(child, container);
        });
      }

      return compNode;
    };

    // 初始化应用
    setTimeout(() => {
      const app = createSampleApp();
      const root = document.getElementById('root');
      window.render(app, root);
      
      console.log('[Inula 2.0 Example] App rendered. DevTools should detect it now.');
      
      // 触发 DevTools 检测
      window.postMessage({
        type: 'INULA_DEV_TOOLS',
        payload: {
          type: 'app-ready',
          version: '2.0'
        },
        from: 'page'
      }, '*');
    }, 500);
  </script>
</body>
</html>
