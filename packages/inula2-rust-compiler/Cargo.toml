[workspace]
members = [
    "src/napi",
    "src/wasm"
]
resolver = "2"

[workspace.dependencies]
chrono = "0.4"
bitvec = { version = "1.0", features = ["serde"] }
wasm-bindgen = "0.2.93"
serde-wasm-bindgen = "0.6.5"
serde = { version = "1.0", features = ["derive"] }
rand = "0.8.5"
js-sys = "0.3.65"
wasm-bindgen-futures = "0.4.33"
serde_json = "1.0"
thiserror = "1.0"
web-sys = { version = "0.3.65", features = ["console", "Window", "Document", "Element", "HtmlElement"] }
linked-hash-map = "0.5.6"
boa_engine = { version = "0.17.0" }
getrandom = { version = "0.2", features = ["js"] }
regex = "1.9.5"
lazy_static = "1.4.0"
assert-json-diff = "2.0"
md5 = "0.7.0"

# NAPI dependencies
napi = { version = "^3.0.0" }
napi-derive = { version = "^3.0.0" }
napi-sys = { version = "^3.0.0" }

# Test dependencies
wasm-bindgen-test = "0.3.42"
criterion = "0.5"

[profile.release]
opt-level = "z"  # 优化大小
lto = true       # 链接时优化
codegen-units = 1 # 减少代码生成单元以提高优化效果
panic = "abort"  # 发生panic时直接终止，不生成panic处理代码
strip = true     # 剥离调试信息
incremental = false # 禁用增量编译

[profile.dev]
incremental = true
