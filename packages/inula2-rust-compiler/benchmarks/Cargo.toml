[package]
name = "inula-compiler-benchmark"
version = "0.1.0"
edition = "2021"

[[bench]]
name = "rust-benchmark"
harness = false

[dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "compilation_benchmark"
harness = false

[[bench]]
name = "memory_benchmark"
harness = false

[[bench]]
name = "concurrent_benchmark"
harness = false



