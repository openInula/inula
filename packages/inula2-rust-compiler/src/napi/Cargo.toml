[package]
name = "inula-compiler-napi"
version = "0.1.0"
edition = "2021"

[lib]
name = "inula_compiler_napi"
path = "src/lib.rs"
crate-type = ["cdylib"]

[features]
default = ["analysis", "codegen", "jsx_impl"]
analysis = []
codegen = []
jsx_impl = []

[dependencies]
# NAPI 相关依赖
napi = { version = "2", features = ["napi4", "async"] }
napi-derive = "2"

# SWC 依赖
swc_common = ">=14.0.0"
swc_ecma_ast = ">=14.0.0"
swc_ecma_parser = ">=14.0.0"
swc_ecma_visit = ">=14.0.0"
swc_ecma_codegen = ">=14.0.0"
swc_atoms = ">=7.0.0"

# 序列化支持
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 其他必要依赖
thiserror = "1.0"
bitvec = "=1.0.1"
regex = "1.10"
rand = "0.8.5"
uuid = { version = "1.0", features = ["v4"] }

# 性能优化
num_cpus = "1.16"
md5 = "0.7"
rayon = "1.8"

[patch.crates-io]
swc_common = { git = "https://github.com/swc-project/swc", branch = "main" }
swc_ecma_ast = { git = "https://github.com/swc-project/swc", branch = "main" }
swc_ecma_parser = { git = "https://github.com/swc-project/swc", branch = "main" }
swc_ecma_visit = { git = "https://github.com/swc-project/swc", branch = "main" }
swc_atoms = { git = "https://github.com/swc-project/swc", branch = "main" }
swc_allocator = { git = "https://github.com/swc-project/swc", branch = "main" }
swc_ecma_codegen = { git = "https://github.com/swc-project/swc", branch = "main" }
