[package]
name = "inula-compiler-wasm"
version = "0.1.0"
edition = "2021"

[lib]
name = "inula_compiler_wasm"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]


[features]
# 默认启用分析与代码生成，jsx_impl 可按需开启
default = ["analysis", "codegen"]
frontend_swc = []
analysis = []
codegen = []
jsx_impl = []

[dependencies]
wasm-bindgen = "0.2.93"
# SWC 版本以 patch 的 git 源为准（此处版本号仅作下限约束）
swc_common = ">=14.0.0"
swc_ecma_ast = ">=14.0.0"
swc_ecma_parser = ">=14.0.0"
swc_ecma_visit = ">=14.0.0"
swc_ecma_codegen = ">=14.0.0"

# 迁移期所需通用依赖
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 已移除 OXC 依赖

# 其他必要依赖
js-sys = "0.3"
thiserror = "1.0"
bitvec = "=1.0.1"
regex = "1.10"
rand = "0.8.5"
getrandom = { version = "0.2", features = ["js"] }

# 性能优化和并发支持 (WASM 兼容版本)
num_cpus = "1.16"
md5 = "0.7"

# WASM 控制台支持
web-sys = { version = "0.3", features = ["console"] }
console_error_panic_hook = { version = "0.1", optional = true }

# WASM 目标特定的依赖
[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.2", features = ["js"] }
regex = "1.9.5"
lazy_static = "1.4.0"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "unwind"
strip = true
incremental = false

[patch.crates-io]
swc_common = { git = "https://github.com/swc-project/swc", branch = "main" }
swc_ecma_ast = { git = "https://github.com/swc-project/swc", branch = "main" }
swc_ecma_parser = { git = "https://github.com/swc-project/swc", branch = "main" }
swc_ecma_visit = { git = "https://github.com/swc-project/swc", branch = "main" }
swc_atoms = { git = "https://github.com/swc-project/swc", branch = "main" }
swc_allocator = { git = "https://github.com/swc-project/swc", branch = "main" }
swc_ecma_codegen = { git = "https://github.com/swc-project/swc", branch = "main" }